[build]
  # Build command: Install dependencies from root, then build preview site
  command = "pnpm install && cd preview && NODE_ENV=preview pnpm build"
  # Publish directory: Where the built static site files are located
  publish = "preview/dist"

[build.environment]
  # Use Node.js 18 or later (Netlify's default, but explicit is better)
  NODE_VERSION = "18"
  # Set environment to 'preview' so assets use correct paths
  NODE_ENV = "preview"

# If you want to deploy the docs site instead, use this configuration:
# [build]
#   command = "cd docs && pnpm build"
#   publish = "docs/dist"

